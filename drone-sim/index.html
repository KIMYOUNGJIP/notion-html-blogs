<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>드론 첫 비행 교실 · SYMA X23 체험</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color:#2C2C2B; background:#F9F8F7; user-select:none; touch-action:none;
  }
  #app { display:flex; flex-direction:column; height:100%; padding:12px; gap:10px; }

  /* ---------- header ---------- */
  header {
    display:flex; align-items:center; gap:12px;
    background:#FFFFFF; border:1px solid #E6E5E3; border-radius:12px; padding:10px 14px;
  }
  header .logo { font-size:26px; }
  header h1 { font-size:19px; margin:0; font-weight:800; letter-spacing:-0.3px; }
  header .sub { font-size:13px; color:#7D7A75; margin-top:2px; }
  .steps { margin-left:auto; display:flex; gap:6px; }
  .steps b {
    width:30px; height:30px; border-radius:8px; display:grid; place-items:center;
    font-size:13px; font-weight:800; background:#F0EFED; color:#7D7A75; border:1px solid #E6E5E3;
  }
  .steps b.now { background:#E5F2FC; color:#2783DE; border-color:#2783DE; }
  .steps b.ok  { background:#E8F1EC; color:#46A171; border-color:#46A171; }
  .ghost {
    border:1px solid #E6E5E3; background:#FFF; color:#7D7A75; font-weight:700;
    font-size:13px; border-radius:8px; padding:8px 12px; min-height:40px;
  }

  /* ---------- stage area ---------- */
  main { flex:1; display:flex; gap:10px; min-height:0; }
  .card { background:#FFF; border:1px solid #E6E5E3; border-radius:12px; }
  #stageWrap { flex:1; position:relative; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; border-radius:11px; }

  #mission {
    width:250px; flex:0 0 250px; padding:14px; display:flex; flex-direction:column; gap:10px;
  }
  #mission .tag { font-size:12px; font-weight:800; color:#2783DE; background:#E5F2FC; border-radius:6px; padding:4px 8px; align-self:flex-start; }
  #mission h2 { margin:0; font-size:18px; font-weight:800; line-height:1.3; }
  #mission p { margin:0; font-size:14px; line-height:1.55; color:#2C2C2B; }
  #mission .bar { height:10px; border-radius:6px; background:#F0EFED; overflow:hidden; }
  #mission .bar i { display:block; height:100%; width:0%; background:#46A171; transition:width .15s linear; }
  #mission ol { margin:2px 0 0; padding-left:18px; }
  #mission ol li { font-size:13px; line-height:1.9; color:#7D7A75; font-weight:700; }
  #mission ol li.now { color:#2783DE; }
  #mission ol li.ok { color:#46A171; text-decoration:line-through; }
  #mission .safe { margin-top:auto; font-size:12px; color:#7D7A75; line-height:1.5; border-top:1px dashed #E6E5E3; padding-top:10px; }

  .badges { position:absolute; top:10px; left:10px; display:flex; gap:6px; flex-wrap:wrap; }
  .badge { font-size:12px; font-weight:800; padding:5px 9px; border-radius:999px; background:#FFFFFFEE; border:1px solid #E6E5E3; color:#7D7A75; }
  .badge.on { background:#E8F1EC; border-color:#46A171; color:#46A171; }
  .badge.warn { background:#FBEBDE; border-color:#D5803B; color:#D5803B; }

  /* ---------- controller ---------- */
  footer {
    flex:0 0 auto; display:flex; align-items:center; gap:14px;
    background:#FFF; border:1px solid #E6E5E3; border-radius:12px; padding:12px 16px;
  }
  .stickBox { text-align:center; }
  .stick {
    position:relative; width:132px; height:132px; border-radius:50%;
    background:#F0EFED; border:2px solid #E6E5E3;
  }
  .stick .knob {
    position:absolute; left:50%; top:50%; width:60px; height:60px; margin:-30px 0 0 -30px;
    border-radius:50%; background:#FFF; border:2px solid #2783DE;
    box-shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.06);
    display:grid; place-items:center; font-size:20px; color:#2783DE;
  }
  .stick .axis { position:absolute; inset:12px; border-radius:50%; border:1px dashed #E6E5E3; }
  .stick.hint { border-color:#2783DE; background:#E5F2FC; }
  .stickBox span { display:block; font-size:12px; font-weight:800; color:#7D7A75; margin-top:6px; }

  .pad { flex:1; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  button.btn {
    min-height:52px; min-width:112px; padding:10px 16px; border-radius:10px; font-size:15px; font-weight:800;
    border:1px solid #E6E5E3; background:#F9F8F7; color:#2C2C2B;
  }
  button.btn.blue { background:#2783DE; border-color:#2783DE; color:#FFF; }
  button.btn.green { background:#46A171; border-color:#46A171; color:#FFF; }
  button.btn.dim { opacity:.45; }
  button.btn.pulse { animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.05);} }
  button.btn:focus-visible, .ghost:focus-visible { outline:3px solid #2783DE; outline-offset:2px; }

  /* ---------- overlay ---------- */
  #overlay {
    position:absolute; inset:0; display:none; place-items:center; background:#FFFFFFE8; border-radius:11px; text-align:center;
  }
  #overlay.show { display:grid; }
  #overlay .in { max-width:460px; padding:22px; }
  #overlay .big { font-size:52px; }
  #overlay h3 { font-size:24px; margin:8px 0 6px; font-weight:800; }
  #overlay p { font-size:15px; color:#7D7A75; margin:0 0 16px; line-height:1.6; }

  @media (max-width: 900px) {
    #mission { display:none; }
    .stick { width:112px; height:112px; }
  }
  @media (prefers-reduced-motion: reduce) { button.btn.pulse { animation:none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🚁</div>
    <div>
      <h1>드론 첫 비행 교실</h1>
      <div class="sub">SYMA X23 · 1~2학년 터치 조종 체험</div>
    </div>
    <div class="steps" id="steps"></div>
    <button class="ghost" id="resetBtn">처음부터</button>
  </header>

  <main>
    <div class="card" id="stageWrap">
      <canvas id="sky"></canvas>
      <div class="badges">
        <div class="badge" id="bTx">조종기 전원</div>
        <div class="badge" id="bDr">드론 전원</div>
        <div class="badge" id="bBind">짝짓기</div>
        <div class="badge" id="bAlt">높이 0.0 m</div>
      </div>
      <div id="overlay"><div class="in">
        <div class="big" id="ovIcon">🎉</div>
        <h3 id="ovTitle"></h3>
        <p id="ovText"></p>
        <button class="btn blue" id="ovBtn">다음 단계</button>
      </div></div>
    </div>

    <div class="card" id="mission">
      <div class="tag" id="mTag">미션</div>
      <h2 id="mTitle"></h2>
      <p id="mText"></p>
      <div class="bar"><i id="mBar"></i></div>
      <ol id="mList"></ol>
      <div class="safe">앞쪽 <b style="color:#E56458">빨간 불</b> · 뒤쪽 <b style="color:#46A171">초록 불</b><br />체험이 끝나면 배터리와 건전지를 꼭 분리해요.</div>
    </div>
  </main>

  <footer>
    <div class="stickBox">
      <div class="stick" id="stickL"><div class="axis"></div><div class="knob" id="knobL">↕</div></div>
      <span>왼쪽 · 높이 / 방향돌기</span>
    </div>
    <div class="pad">
      <div class="row">
        <button class="btn" id="btnTx">🎮 조종기 전원</button>
        <button class="btn" id="btnDrone">🔋 드론 전원</button>
        <button class="btn green" id="btnB">🅱 원키 이착륙</button>
      </div>
      <div class="row">
        <button class="btn" id="btnSpeed">🐢 저속 모드</button>
        <button class="btn" id="btnHelp">❓ 도움말</button>
      </div>
    </div>
    <div class="stickBox">
      <div class="stick" id="stickR"><div class="axis"></div><div class="knob" id="knobR">✥</div></div>
      <span>오른쪽 · 앞뒤 / 좌우이동</span>
    </div>
  </footer>
</div>

<script>
(function(){
  "use strict";
  /* ================= state ================= */
  var FW = 12, FH = 9;                 // field meters
  var HOME = { x: 6, y: 7.6 };
  var GATE = { x: 6, y: 2.6 };
  var STAR = { x: 10.6, y: 4.6 };
  var d = { x: HOME.x, y: HOME.y, alt: 0, head: 0 };
  var tx = false, drone = false, bound = false, slow = true;
  var autoTakeoff = false, autoLand = false;
  var bindPhase = 0;                    // 0 none, 1 pushed up
  var stage = 0, holdT = 0, gateT = 0, done = false;
  var L = { x:0, y:0 }, R = { x:0, y:0 };
  var parts = [];

  var MISSIONS = [
    { tag:"1단계", title:"전원을 켜고 짝짓기",
      text:"① 🎮 조종기 전원 ② 🔋 드론 전원을 누르고, 왼쪽 스틱을 위로 쭉 올렸다가 아래로 내려요.",
      hint:"L", ok:"짝짓기 성공! 드론과 조종기가 친구가 되었어요." },
    { tag:"2단계", title:"살짝 이륙하기",
      text:"🅱 원키 이착륙 버튼을 눌러요. 드론이 스스로 떠서 제자리에 멈춰요(호버링).",
      hint:"B", ok:"이륙 성공! 기압 센서가 높이를 지켜 줘요." },
    { tag:"3단계", title:"앞으로 가기",
      text:"오른쪽 스틱을 위로 밀어 파란 링 안으로 들어가요. 앞쪽은 빨간 불이에요.",
      hint:"R", ok:"링 통과! 앞으로 가기를 잘했어요." },
    { tag:"4단계", title:"뒤로 돌아오기",
      text:"오른쪽 스틱을 아래로 당겨 H 착륙판 위로 천천히 돌아와요.",
      hint:"R", ok:"제자리 복귀! 뒤로 오기도 성공이에요." },
    { tag:"5단계", title:"방향 돌리기",
      text:"왼쪽 스틱을 옆으로 밀어 노란 별을 바라보게 돌려요. 2초 동안 유지해요.",
      hint:"L", ok:"방향 전환 성공! 빨간 불이 별을 향했어요." },
    { tag:"6단계", title:"안전하게 착륙",
      text:"H 착륙판 위에서 🅱 버튼을 눌러 살살 내려앉아요.",
      hint:"B", ok:"착륙 성공! 프로펠러가 멈췄어요." }
  ];

  var $ = function(id){ return document.getElementById(id); };
  var cv = $("sky"), ctx = cv.getContext("2d"), S = 1, ox = 0, oy = 0, W = 0, H = 0;

  function resize(){
    var r = cv.parentNode.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W / FW, H / FH) * 0.94;
    ox = (W - FW * S) / 2; oy = (H - FH * S) / 2;
  }
  window.addEventListener("resize", resize);

  function px(mx){ return ox + mx * S; }
  function py(my){ return oy + my * S; }

  /* ================= sticks ================= */
  function bindStick(baseId, knobId, out){
    var base = $(baseId), knob = $(knobId), id = null;
    function set(e){
      var r = base.getBoundingClientRect(), max = r.width / 2 - 8;
      var dx = e.clientX - (r.left + r.width / 2);
      var dy = e.clientY - (r.top + r.height / 2);
      var len = Math.hypot(dx, dy);
      if (len > max) { dx *= max / len; dy *= max / len; }
      knob.style.transform = "translate(" + dx + "px," + dy + "px)";
      out.x = dx / max; out.y = dy / max;
    }
    function up(){ id = null; out.x = 0; out.y = 0; knob.style.transform = "translate(0,0)"; }
    base.addEventListener("pointerdown", function(e){ id = e.pointerId; base.setPointerCapture(id); set(e); });
    base.addEventListener("pointermove", function(e){ if (e.pointerId === id) set(e); });
    base.addEventListener("pointerup", up);
    base.addEventListener("pointercancel", up);
    base.addEventListener("lostpointercapture", up);
    // keyboard fallback
    base.tabIndex = 0;
  }
  bindStick("stickL", "knobL", L);
  bindStick("stickR", "knobR", R);

  /* keyboard support (desktop) */
  var keys = {};
  window.addEventListener("keydown", function(e){ keys[e.key] = true; });
  window.addEventListener("keyup", function(e){ keys[e.key] = false; });

  /* ================= buttons ================= */
  $("btnTx").onclick = function(){ tx = !tx; beep(880); paint(); };
  $("btnDrone").onclick = function(){ drone = !drone; if (!drone) { bound = false; bindPhase = 0; } beep(660); paint(); };
  $("btnB").onclick = function(){
    if (!bound) { flash("먼저 전원과 짝짓기를 해요", "⚠️"); return; }
    if (d.alt < 0.08) { autoTakeoff = true; autoLand = false; beep(1040); }
    else { autoLand = true; autoTakeoff = false; beep(520); }
  };
  $("btnSpeed").onclick = function(){ slow = !slow; $("btnSpeed").textContent = slow ? "🐢 저속 모드" : "🐇 고속 모드"; paint(); };
  $("btnHelp").onclick = function(){ show("❓", MISSIONS[stage] ? MISSIONS[stage].title : "체험 완료", MISSIONS[stage] ? MISSIONS[stage].text : "처음부터 다시 할 수 있어요.", "닫기", function(){ hide(); }); };
  $("resetBtn").onclick = function(){ reset(); };

  function reset(){
    d = { x: HOME.x, y: HOME.y, alt: 0, head: 0 };
    tx = drone = bound = false; bindPhase = 0; autoTakeoff = autoLand = false;
    stage = 0; holdT = 0; gateT = 0; done = false; parts = [];
    hide(); paint();
  }

  /* ================= sound ================= */
  var AC = null;
  function beep(f){
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain();
      o.frequency.value = f; o.type = "sine"; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0.05, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 0.18);
      o.start(); o.stop(AC.currentTime + 0.2);
    } catch (e) {}
  }

  /* ================= overlay ================= */
  function show(icon, title, text, btn, fn){
    $("ovIcon").textContent = icon; $("ovTitle").textContent = title;
    $("ovText").textContent = text; $("ovBtn").textContent = btn;
    $("ovBtn").onclick = fn; $("overlay").classList.add("show");
  }
  function hide(){ $("overlay").classList.remove("show"); }
  function flash(msg, icon){ show(icon || "💡", msg, "안내를 다시 읽고 순서대로 해 볼까요?", "확인", hide); }

  function confetti(){
    for (var i = 0; i < 70; i++) {
      parts.push({ x: W / 2, y: H / 2, vx: (Math.random() - 0.5) * 420, vy: (Math.random() - 0.8) * 420,
        c: ["#2783DE","#46A171","#D5803B","#E56458","#BF8EDA","#EAC26B"][i % 6], t: 1 });
    }
  }

  function clearStage(){
    var m = MISSIONS[stage];
    beep(1320); confetti();
    if (stage === MISSIONS.length - 1) {
      done = true;
      show("🏅", "드론 조종사 자격 통과!", "전원 → 짝짓기 → 이륙 → 앞뒤 이동 → 방향 전환 → 착륙까지 모두 성공했어요. 실제 드론은 배터리와 건전지를 꼭 분리해서 보관해요.", "다시 도전", function(){ reset(); });
    } else {
      show("🎉", "성공!", m.ok, "다음 단계", function(){ stage++; holdT = 0; hide(); paint(); });
    }
  }

  /* ================= loop ================= */
  var last = performance.now();
  function loop(now){
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    step(dt); draw(dt); requestAnimationFrame(loop);
  }

  function step(dt){
    var lx = L.x, ly = L.y, rx = R.x, ry = R.y;
    if (keys.ArrowUp) ry = -1; if (keys.ArrowDown) ry = 1;
    if (keys.ArrowLeft) lx = -1; if (keys.ArrowRight) lx = 1;
    if (keys.w) ly = -1; if (keys.s) ly = 1;

    /* binding: left stick up then down */
    if (tx && drone && !bound) {
      if (ly < -0.7) bindPhase = 1;
      if (bindPhase === 1 && ly > 0.6) { bound = true; beep(1200); }
    }

    var live = tx && drone && bound;
    var spd = slow ? 1.5 : 2.9;

    if (live) {
      if (autoTakeoff) {
        d.alt += 1.1 * dt;
        if (d.alt >= 1.2) { d.alt = 1.2; autoTakeoff = false; }
      } else if (autoLand) {
        d.alt -= 0.8 * dt;
        if (d.alt <= 0) { d.alt = 0; autoLand = false; }
      } else {
        d.alt += (-ly) * 1.1 * dt;
        d.alt = Math.max(0, Math.min(2.6, d.alt));
      }
      d.head += lx * (slow ? 1.4 : 2.2) * dt;
      if (d.alt > 0.1) {
        var f = -ry * spd * dt, s = rx * spd * 0.8 * dt;
        d.x += Math.sin(d.head) * f + Math.cos(d.head) * s;
        d.y += -Math.cos(d.head) * f + Math.sin(d.head) * s;
        d.x = Math.max(0.6, Math.min(FW - 0.6, d.x));
        d.y = Math.max(0.6, Math.min(FH - 0.6, d.y));
      }
    }

    if (done || $("overlay").classList.contains("show")) { paint(); return; }

    /* stage checks */
    var p = 0;
    if (stage === 0) {
      p = (tx ? 0.33 : 0) + (drone ? 0.33 : 0) + (bound ? 0.34 : 0);
      if (bound) clearStage();
    } else if (stage === 1) {
      p = Math.min(1, d.alt / 1.0);
      if (d.alt >= 0.95) clearStage();
    } else if (stage === 2) {
      var dg = Math.hypot(d.x - GATE.x, d.y - GATE.y);
      p = Math.max(0, Math.min(1, 1 - (dg - 0.8) / 4.4));
      if (dg < 0.85 && d.alt > 0.3) clearStage();
    } else if (stage === 3) {
      var dh = Math.hypot(d.x - HOME.x, d.y - HOME.y);
      p = Math.max(0, Math.min(1, 1 - (dh - 0.8) / 4.4));
      if (dh < 0.85 && d.alt > 0.3) clearStage();
    } else if (stage === 4) {
      var want = Math.atan2(STAR.x - d.x, -(STAR.y - d.y));
      var diff = Math.atan2(Math.sin(d.head - want), Math.cos(d.head - want));
      if (Math.abs(diff) < 0.22) holdT += dt; else holdT = Math.max(0, holdT - dt * 1.5);
      p = Math.min(1, holdT / 2);
      if (holdT >= 2) clearStage();
    } else if (stage === 5) {
      var dh2 = Math.hypot(d.x - HOME.x, d.y - HOME.y);
      p = d.alt <= 0.02 ? 1 : (dh2 < 1 ? 0.5 : 0.15);
      if (d.alt <= 0.02 && dh2 < 1.2 && bound) clearStage();
    }
    $("mBar").style.width = Math.round(p * 100) + "%";
    paint();
  }

  /* ================= UI paint ================= */
  function paint(){
    var m = MISSIONS[stage];
    $("mTag").textContent = m ? m.tag : "완료";
    $("mTitle").textContent = m ? m.title : "체험 완료";
    $("mText").textContent = m ? m.text : "처음부터 버튼으로 다시 도전할 수 있어요.";
    var st = $("steps");
    if (st.children.length !== MISSIONS.length) {
      st.innerHTML = "";
      for (var i = 0; i < MISSIONS.length; i++) { var b = document.createElement("b"); b.textContent = i + 1; st.appendChild(b); }
    }
    for (var j = 0; j < MISSIONS.length; j++) {
      st.children[j].className = done || j < stage ? "ok" : (j === stage ? "now" : "");
    }
    var ml = $("mList");
    if (ml.children.length !== MISSIONS.length) {
      ml.innerHTML = "";
      for (var k = 0; k < MISSIONS.length; k++) {
        var li = document.createElement("li"); li.textContent = MISSIONS[k].title; ml.appendChild(li);
      }
    }
    for (var k2 = 0; k2 < MISSIONS.length; k2++) {
      ml.children[k2].className = done || k2 < stage ? "ok" : (k2 === stage ? "now" : "");
    }
    $("bTx").className = "badge" + (tx ? " on" : "");
    $("bDr").className = "badge" + (drone ? " on" : "");
    $("bBind").className = "badge" + (bound ? " on" : " warn");
    $("bBind").textContent = bound ? "짝짓기 완료" : "짝짓기 필요";
    $("bAlt").textContent = "높이 " + d.alt.toFixed(1) + " m";
    $("btnTx").className = "btn" + (tx ? " blue" : "") + (!tx && stage === 0 ? " pulse" : "");
    $("btnDrone").className = "btn" + (drone ? " blue" : "") + (tx && !drone && stage === 0 ? " pulse" : "");
    $("btnB").className = "btn green" + (!bound ? " dim" : "") + (bound && m && m.hint === "B" ? " pulse" : "");
    $("stickL").className = "stick" + (m && m.hint === "L" ? " hint" : "");
    $("stickR").className = "stick" + (m && m.hint === "R" ? " hint" : "");
  }

  /* ================= canvas draw ================= */
  function draw(dt){
    ctx.clearRect(0, 0, W, H);
    /* sky/field */
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#F4FAFF"); g.addColorStop(1, "#EAF6EE");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "#E6E5E3"; ctx.lineWidth = 1;
    for (var i = 0; i <= FW; i++) { ctx.beginPath(); ctx.moveTo(px(i), py(0)); ctx.lineTo(px(i), py(FH)); ctx.stroke(); }
    for (var j2 = 0; j2 <= FH; j2++) { ctx.beginPath(); ctx.moveTo(px(0), py(j2)); ctx.lineTo(px(FW), py(j2)); ctx.stroke(); }
    ctx.strokeStyle = "#46A171"; ctx.lineWidth = 3;
    ctx.strokeRect(px(0), py(0), FW * S, FH * S);

    /* landing pad */
    ctx.beginPath(); ctx.arc(px(HOME.x), py(HOME.y), 0.95 * S, 0, 6.3);
    ctx.fillStyle = (stage === 3 || stage === 5) ? "#E8F1EC" : "#F0EFED";
    ctx.fill(); ctx.strokeStyle = (stage === 3 || stage === 5) ? "#46A171" : "#C9C7C3";
    ctx.lineWidth = 4; ctx.setLineDash([10, 8]); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#7D7A75"; ctx.font = "800 " + (0.8 * S) + "px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("H", px(HOME.x), py(HOME.y));

    /* gate ring */
    gateT += dt;
    var pulse = stage === 2 ? 1 + Math.sin(gateT * 3) * 0.05 : 1;
    ctx.beginPath(); ctx.arc(px(GATE.x), py(GATE.y), 0.9 * S * pulse, 0, 6.3);
    ctx.lineWidth = 8; ctx.strokeStyle = stage === 2 ? "#2783DE" : "#CFE4F7"; ctx.stroke();
    ctx.font = (0.75 * S) + "px sans-serif";
    ctx.fillText("🎯", px(GATE.x), py(GATE.y));

    /* star target */
    ctx.font = (0.95 * S) + "px sans-serif";
    ctx.globalAlpha = stage === 4 ? 1 : 0.45;
    ctx.fillText("⭐", px(STAR.x), py(STAR.y));
    ctx.globalAlpha = 1;

    /* shadow */
    ctx.beginPath();
    ctx.ellipse(px(d.x), py(d.y) + d.alt * 0.16 * S, (0.55 + d.alt * 0.12) * S, (0.28 + d.alt * 0.06) * S, 0, 0, 6.3);
    ctx.fillStyle = "rgba(44,44,43," + (0.16 - Math.min(d.alt, 2.6) * 0.04) + ")"; ctx.fill();

    /* drone */
    var scale = 1 + d.alt * 0.10;
    ctx.save();
    ctx.translate(px(d.x), py(d.y) - d.alt * 0.22 * S);
    ctx.rotate(d.head);
    ctx.scale(scale, scale);
    var arm = 0.52 * S, rr = 0.24 * S;
    ctx.strokeStyle = "#4A4A48"; ctx.lineWidth = 0.10 * S;
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(a){
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(a[0] * arm, a[1] * arm); ctx.stroke();
    });
    var spin = (tx && drone && bound && (d.alt > 0.02 || autoTakeoff)) ? 1 : 0;
    var ang = spin ? performance.now() / 26 : 0;
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(a, k){
      var cxp = a[0] * arm, cyp = a[1] * arm;
      ctx.beginPath(); ctx.arc(cxp, cyp, rr, 0, 6.3);
      ctx.fillStyle = spin ? "rgba(39,131,222,0.20)" : "rgba(230,229,227,0.9)"; ctx.fill();
      ctx.strokeStyle = "#7D7A75"; ctx.lineWidth = 2; ctx.stroke();
      ctx.save(); ctx.translate(cxp, cyp); ctx.rotate(ang + k);
      ctx.strokeStyle = "#2C2C2B"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-rr * 0.85, 0); ctx.lineTo(rr * 0.85, 0); ctx.stroke();
      ctx.restore();
      /* LED: front(top) red, rear(bottom) green */
      ctx.beginPath(); ctx.arc(cxp, cyp, rr * 0.30, 0, 6.3);
      ctx.fillStyle = a[1] < 0 ? "#E56458" : "#46A171"; ctx.fill();
    });
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(-0.30 * S, -0.36 * S, 0.60 * S, 0.72 * S, 0.14 * S)
                  : ctx.rect(-0.30 * S, -0.36 * S, 0.60 * S, 0.72 * S);
    ctx.fillStyle = "#FFFFFF"; ctx.fill();
    ctx.strokeStyle = "#2C2C2B"; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -0.36 * S); ctx.lineTo(-0.13 * S, -0.16 * S); ctx.lineTo(0.13 * S, -0.16 * S); ctx.closePath();
    ctx.fillStyle = "#E56458"; ctx.fill();
    ctx.restore();

    /* altitude gauge (inside field, right side) */
    var bw = 20, bh = FH * S * 0.62;
    var bx = px(FW) - bw - 16, by = py(FH) - bh - 22;
    ctx.fillStyle = "#FFFFFF"; ctx.strokeStyle = "#E6E5E3"; ctx.lineWidth = 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 10); else ctx.rect(bx, by, bw, bh);
    ctx.fill(); ctx.stroke();
    var hFill = Math.min(1, d.alt / 2.6) * (bh - 4);
    ctx.fillStyle = "#2783DE";
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx + 2, by + bh - 2 - hFill, bw - 4, hFill, 8);
    else ctx.rect(bx + 2, by + bh - 2 - hFill, bw - 4, hFill);
    ctx.fill();
    ctx.fillStyle = "#7D7A75"; ctx.font = "700 12px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("높이", bx + bw / 2, by + bh + 12);

    /* confetti */
    for (var q = parts.length - 1; q >= 0; q--) {
      var p2 = parts[q];
      p2.vy += 620 * dt; p2.x += p2.vx * dt; p2.y += p2.vy * dt; p2.t -= dt * 0.55;
      if (p2.t <= 0) { parts.splice(q, 1); continue; }
      ctx.globalAlpha = Math.max(0, p2.t);
      ctx.fillStyle = p2.c; ctx.fillRect(p2.x, p2.y, 9, 9);
      ctx.globalAlpha = 1;
    }
  }

  resize(); paint(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
